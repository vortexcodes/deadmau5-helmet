<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d0d10">
<meta name="mobile-web-app-capable" content="yes">
<title>mau5ctl</title>
<style>
 :root{--bg:#0d0d10;--card:#17171e;--line:#2a2a35;--fg:#e8e8ef;--dim:#8a8a99;
       --accent:#00c8ff;--hot:#ff2d6f;--ok:#38d39f;--warn:#ffb020}
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
   -webkit-user-select:none;user-select:none}
 html,body{margin:0;height:100%;overscroll-behavior:none}
 body{background:var(--bg);color:var(--fg);display:flex;flex-direction:column;
      font:16px/1.35 ui-sans-serif,system-ui,-apple-system,Roboto,sans-serif;
      padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
 header{display:flex;align-items:center;gap:8px;padding:9px 14px;flex:none;
        border-bottom:1px solid var(--line)}
 .dot{width:9px;height:9px;border-radius:50%;background:var(--dim)}
 .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
 .dot.err{background:var(--hot)}
 h1{font-size:14px;margin:0;font-weight:650;letter-spacing:.02em}
 #pwr{margin-left:auto;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
 #pwr.cap{color:var(--warn);font-weight:700}
 nav{display:flex;border-bottom:1px solid var(--line);flex:none}
 nav button{flex:1;background:none;border:none;color:var(--dim);font-size:14px;
            font-weight:650;padding:11px 0;border-bottom:2px solid transparent}
 nav button.sel{color:var(--accent);border-bottom-color:var(--accent)}
 main{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
 .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
 .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;
       padding:14px 6px;text-align:center;font-size:13px;font-weight:650;
       color:var(--fg);min-height:66px;display:flex;align-items:center;
       justify-content:center}
 .tile.sel{background:linear-gradient(180deg,#0097c4,#006c8c);border-color:#0bd;
           color:#fff}
 .row{display:flex;gap:9px;align-items:center;margin:11px 0}
 .lbl{color:var(--dim);font-size:11px;text-transform:uppercase;
      letter-spacing:.09em;margin:14px 0 6px}
 input[type=range]{width:100%;height:34px}
 .showrow{display:flex;align-items:center;gap:10px;background:var(--card);
          border:1px solid var(--line);border-radius:13px;padding:11px 13px;
          margin-bottom:9px}
 .showrow.sel{border-color:var(--accent)}
 .showrow b{font-size:14px;font-weight:650;flex:1;overflow:hidden;
            text-overflow:ellipsis;white-space:nowrap}
 .showrow span{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
 #transport{flex:none;border-top:1px solid var(--line);padding:10px 12px;
            background:#111118}
 #bar{height:5px;background:#000;border-radius:3px;overflow:hidden;margin-bottom:9px}
 #fill{height:100%;width:0;background:var(--accent)}
 .tbtns{display:flex;gap:9px}
 .tbtns button{flex:1;min-height:52px;border-radius:13px;border:1px solid var(--line);
               background:#20202a;color:var(--fg);font-size:16px;font-weight:700}
 #playbtn{background:linear-gradient(180deg,#2a6a3f,#1d4c2d);border-color:#2f7a49;
          color:#d8ffe8;flex:2}
 #playbtn.on{background:linear-gradient(180deg,#8a5a10,#5c3c08);border-color:#a8701a;
             color:#ffe9c2}
 #blackout{background:#3a1020;border-color:#5a1c33;color:#ffb9cd}
 .swatches{display:flex;gap:8px;flex-wrap:wrap}
 .sw{width:46px;height:46px;border-radius:12px;border:2px solid #0006}
 .sw.sel{border-color:#fff}
 .note{font-size:12px;color:var(--dim);margin-top:4px}
 .prow{display:flex;align-items:center;gap:10px;margin:7px 0}
 .prow label{width:88px;font-size:12px;color:var(--dim);flex:none;
             text-transform:uppercase;letter-spacing:.06em}
 .prow input[type=range]{flex:1}
 .prow output{width:54px;text-align:right;font-size:12px;color:var(--fg);
              font-variant-numeric:tabular-nums}
 .toggle{min-height:38px;padding:0 18px;border-radius:10px;border:1px solid var(--line);
         background:#20202a;color:var(--dim);font-weight:700;font-size:13px}
 .toggle.on{background:var(--accent);color:#04202a;border-color:var(--accent)}
 .favs{display:flex;flex-wrap:wrap;gap:8px}
 .fav{display:flex;align-items:center;gap:8px;background:#12252c;
      border:1px solid #1d3f4a;border-radius:11px;padding:9px 11px;
      color:#a9e6f7;font-size:13px;font-weight:650}
 .fav i{font-style:normal;color:#ff7fa5;font-size:17px;padding:0 2px}
 .txt{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);
      background:#0e0e14;color:var(--fg);font-size:15px;padding:0 11px;
      -webkit-user-select:text;user-select:text}
 #cue{font-size:12px;color:var(--accent);font-weight:650;min-height:16px}
 /* On a wide screen the phone column leaves the preview postage-stamp
    sized and everything else stranded beside a metre of empty space.
    Give the preview the room and stack the controls down one side. */
 @media (min-width:760px){
   body{display:grid;height:100vh;
        grid-template-columns:1fr minmax(360px,440px);
        grid-template-rows:auto auto 1fr auto}
   header{grid-column:1/span 2}
   #prevwrap{grid-column:1;grid-row:2/span 3;height:auto !important;
             border-right:1px solid var(--line);border-bottom:none;
             display:flex;align-items:center;justify-content:center}
   #prev{width:100%;height:100%;object-fit:contain}
   nav{grid-column:2;grid-row:2}
   main{grid-column:2;grid-row:3;min-height:0}
   #transport{grid-column:2;grid-row:4;border-top:1px solid var(--line)}
   .grid{grid-template-columns:repeat(2,1fr)}
   .tile{min-height:54px;font-size:14px}
 }
 /* Live preview.  Blurred at the canvas level rather than per LED:
    one GPU pass instead of 622 shadowBlur fills, which a phone will
    not keep up with. */
 #prevwrap{flex:none;position:relative;background:#06060a;
           border-bottom:1px solid var(--line);overflow:hidden;
           transition:height .18s ease}
 #prev{display:block;width:100%;height:100%;filter:blur(0.9px) saturate(1.12)}
 #prevtag{position:absolute;left:10px;bottom:6px;font-size:10px;color:#5a5a68;
          letter-spacing:.08em;text-transform:uppercase}
 #prevtag.sim{color:var(--warn)}
</style>
</head>
<body>
<header><span class="dot" id="dot"></span><h1>mau5ctl</h1><span id="pwr">--</span></header>
<div id="prevwrap"><canvas id="prev"></canvas><span id="prevtag">preview</span></div>
<nav>
  <button data-tab="presets" class="sel">PRESETS</button>
  <button data-tab="shows">SHOWS</button>
  <button data-tab="settings">SET</button>
</nav>
<main id="main"></main>
<div id="transport">
  <div id="cue"></div>
  <div id="bar"><div id="fill"></div></div>
  <div class="tbtns">
    <button id="playbtn">PLAY</button>
    <button id="back">&minus;15</button>
    <button id="blackout">OFF</button>
  </div>
</div>
<audio id="au" preload="auto"></audio>
<script>
let S = null, tab = 'presets', colour = [255,160,0], busy = false;
let LAY = null, prevOn = 0;
const au = document.getElementById('au');
const COLOURS = [[255,40,0],[255,160,0],[255,255,255],[0,220,255],
                 [0,255,140],[120,0,255],[255,0,120],[255,230,180]];

const rgb = c => 'rgb('+c[0]+','+c[1]+','+c[2]+')';
function syncNote(){
  if(!S) return '';
  if(!S.bpm) return 'no track loaded';
  if(!S.lockable) return S.preset + ' does not lock';
  if(!S.lock_beats) return S.bpm + ' bpm';
  const b = S.lock_beats;
  const name = b>=4 ? (b/4)+' bar'+(b>4?'s':'') : b+' beat'+(b===1?'':'s');
  return name + ' @ ' + S.bpm + ' bpm';
}
const mmss = s => (s<0?0:Math.floor(s/60))+':'+String(Math.floor(s%60)).padStart(2,'0');

async function post(path, body){
  try{
    const r = await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},
                               body:JSON.stringify(body||{})});
    S = await r.json(); draw();
  }catch(e){ document.getElementById('dot').className='dot err'; }
}

// Rebuilding main on every poll would steal focus from a slider the
// user is dragging and reset it mid-gesture.  So the status line always
// refreshes, but the panel only when something it shows has changed and
// nothing in it is being touched.
function sig(){
  return JSON.stringify([tab, S.mode, S.preset, S.show, S.presets.length,
                         S.shows, S.spec && S.spec.map(d=>d.name),
                         tab==='presets' ? S.params : null,
                         tab==='presets' ? [S.sync,S.pulse,S.lock_beats,S.bpm] : null,
                         tab==='settings' ? S.brightness : null]);
}
let lastSig = null;

function draw(force){
  if(!S) return;
  const dot = document.getElementById('dot');
  dot.className = S.simulated ? 'dot' : ((S.helmet_ok === false) ? 'dot err' : 'dot on');
  dot.title = S.simulated ? 'no helmet attached' : (S.helmet_note || '');
  const tag = document.getElementById('prevtag');
  tag.textContent = S.simulated ? 'simulated \u00b7 no helmet' : 'live';
  tag.className = S.simulated ? 'sim' : '';
  const p = document.getElementById('pwr');
  p.textContent = (S.amps!=null ? S.amps.toFixed(2)+' A · '+S.watts.toFixed(0)+' W' : '--');
  p.className = (S.governor||S.ceiling||S.helmet_ok===false) ? 'cap' : '';
  if(S.simulated) p.textContent = (S.watts!=null ? S.watts.toFixed(0)+' W would draw' : 'no helmet');
  else if(S.helmet_ok === false) p.textContent = 'helmet unreachable';
  else if(S.thermal){
    const th = S.thermal;
    p.textContent = (S.amps!=null ? S.amps.toFixed(2)+' A' : '--')
      + ' \u00b7 heat ' + Math.round(th.full_pct) + '%';
    if(th.full_pct > 80) p.className = 'cap';
  }
  document.getElementById('cue').textContent =
    S.mode==='show' ? (S.show||'')+(S.cue?'  —  '+S.cue:'') : (S.preset||'');
  document.getElementById('fill').style.width =
    (S.duration ? 100*Math.min(1,S.t/S.duration) : 0)+'%';
  document.getElementById('playbtn').textContent =
    S.mode==='show' ? (au.paused ? 'PLAY' : 'PAUSE') : 'LIVE';
  document.getElementById('playbtn').className = au.paused ? '' : 'on';

  const m = document.getElementById('main');
  const touching = m.contains(document.activeElement) &&
                   document.activeElement !== document.body;
  const sg = sig();
  if(!force && sg === lastSig) return;
  if(touching && !force) return;
  lastSig = sg;
  if(tab==='presets'){
    const spec = (S.mode==='preset' && S.spec) ? S.spec : [];
    m.innerHTML = '<div class="grid">' + S.presets.map(n=>
      `<div class="tile${S.mode==='preset'&&S.preset===n?' sel':''}" data-p="${n}">${n}</div>`
    ).join('') + '</div>' +
    '<div class="lbl">colour</div><div class="swatches">' + COLOURS.map((c,i)=>
      `<div class="sw${rgb(c)===rgb(colour)?' sel':''}" data-c="${i}" style="background:${rgb(c)}"></div>`
    ).join('') + '</div>' +
    ((S.favourites && S.favourites.length) ?
      '<div class="lbl">saved</div><div class="favs">' + S.favourites.map(f=>
        `<div class="fav" data-f="${f.label}"><b>${f.label}</b>
         <i data-x="${f.label}">&times;</i></div>`).join('') + '</div>' : '') +
    (spec.length ? '<div class="lbl">'+S.preset+' settings</div>' + spec.map(d=>{
      const cur = S.params[d.name];
      if(d.kind==='number')
        return `<div class="prow"><label>${d.name}</label>
          <input type="range" data-n="${d.name}" min="${d.min}" max="${d.max}"
                 step="${d.step}" value="${cur}">
          <output id="o_${d.name}">${(+cur).toFixed(2)}</output></div>`;
      if(d.kind==='bool')
        return `<div class="prow"><label>${d.name}</label>
          <button class="toggle${cur?' on':''}" data-b="${d.name}">${cur?'ON':'OFF'}</button></div>`;
      if(d.kind==='text')
        return `<div class="prow"><label>${d.name}</label>
          <input class="txt" type="text" data-t="${d.name}" value="${String(cur).replace(/"/g,'&quot;')}"></div>`;
      return '';
    }).join('') +
      `<div class="prow"><label>save as</label>
       <input class="txt" type="text" id="favname" placeholder="name this look">
       <button class="toggle on" id="savefav">SAVE</button></div>` +
      '<div class="prow"><button class="toggle" id="randomise">RANDOMISE</button>' +
      '<button class="toggle" id="defaults">DEFAULTS</button></div>'
     : '<div class="note">Tap a preset to tune it.</div>') +
    '<div class="lbl">sync to music</div>' +
    `<div class="prow"><label>beat lock</label>
      <button class="toggle${S.sync?' on':''}" id="synctog">${S.sync?'ON':'OFF'}</button>
      <output style="width:auto">${syncNote()}</output></div>
     <div class="prow"><label>beat pulse</label>
      <input type="range" id="pulse" min="0" max="0.8" step="0.02" value="${S.pulse}">
      <output id="o_pulse">${(+S.pulse).toFixed(2)}</output></div>`;

    m.querySelectorAll('[data-p]').forEach(el=>el.onclick=()=>
      post('/api/preset',{name:el.dataset.p, params:{color:colour}}));
    m.querySelectorAll('[data-c]').forEach(el=>el.onclick=()=>{
      colour = COLOURS[+el.dataset.c];
      if(S.mode==='preset'&&S.preset) edit({color:colour}); else draw();
    });
    m.querySelectorAll('[data-n]').forEach(el=>{
      el.oninput = ()=>{ document.getElementById('o_'+el.dataset.n).textContent =
                           (+el.value).toFixed(2); };
      el.onchange = ()=>edit({[el.dataset.n]: +el.value});
    });
    m.querySelectorAll('[data-b]').forEach(el=>el.onclick=()=>
      edit({[el.dataset.b]: !(S.params[el.dataset.b])}));
    m.querySelectorAll('[data-t]').forEach(el=>{
      el.onchange = ()=>edit({[el.dataset.t]: el.value});
      el.onkeydown = e=>{ if(e.key==='Enter') el.blur(); };
    });
    m.querySelectorAll('[data-f]').forEach(el=>el.onclick=e=>{
      if(e.target.dataset.x) return;
      post('/api/recall', {label: el.dataset.f});
    });
    m.querySelectorAll('[data-x]').forEach(el=>el.onclick=e=>{
      e.stopPropagation();
      post('/api/forget', {label: el.dataset.x});
    });
    const st = document.getElementById('synctog');
    if(st) st.onclick = ()=>post('/api/sync',{sync: !S.sync});
    const pu = document.getElementById('pulse');
    if(pu){
      pu.oninput = ()=>{ document.getElementById('o_pulse').textContent =
                           (+pu.value).toFixed(2); };
      pu.onchange = ()=>post('/api/sync',{pulse: +pu.value});
    }
    const rnd = document.getElementById('randomise');
    if(rnd) rnd.onclick = ()=>{
      // within the spec's own bounds, so a roll can never ask for
      // something the preset would reject
      const kw = {};
      for(const d of S.spec){
        if(d.kind==='number') kw[d.name] = +(d.min + Math.random()*(d.max-d.min)).toFixed(3);
        else if(d.kind==='bool') kw[d.name] = Math.random() < 0.5;
      }
      kw.color = [Math.random(),Math.random(),Math.random()]
                   .map(v=>Math.round(40+215*v));
      colour = kw.color;
      post('/api/preset',{name:S.preset, params:kw});
    };
    const dft = document.getElementById('defaults');
    if(dft) dft.onclick = ()=>post('/api/preset',{name:S.preset, params:{}});
    const sb = document.getElementById('savefav');
    if(sb) sb.onclick = ()=>{
      const f = document.getElementById('favname');
      if(f && f.value.trim()){ post('/api/save', {label: f.value.trim()});
                               f.value = ''; }
    };
  } else if(tab==='shows'){
    m.innerHTML = S.shows.map(n=>
      `<div class="showrow${S.show===n?' sel':''}" data-s="${n}"><b>${n.replace(/\.json$/,'')}</b>
       <span>${S.show===n?mmss(S.t)+' / '+mmss(S.duration):''}</span></div>`
    ).join('') || '<div class="note">No shows built yet.</div>';
    m.querySelectorAll('[data-s]').forEach(el=>el.onclick=()=>loadShow(el.dataset.s));
  } else {
    m.innerHTML =
      '<div class="lbl">master brightness</div>'+
      `<input type="range" id="bri" min="0" max="100" value="${Math.round((S.brightness||0)*100)}">`+
      `<div class="note">Scales everything before the power guard. The guard still
       caps the helmet at its own budget, so this can only make it dimmer.</div>`+
      '<div class="lbl">audio output</div>'+
      '<div class="note">The track plays on this phone, so it goes wherever this '+
      'phone is pointed — pair your Bluetooth speaker in Android settings and '+
      'it follows automatically. The helmet follows the audio, not the other way round.</div>'+
      '<div class="lbl">heat</div>'+
      (S.thermal ? `<div class="note">The helmet is allowed
        ${S.thermal.sustained_w} W indefinitely and bursts above it on
        ${S.thermal.burst_j} J of thermal mass. Bucket
        <b>${Math.round(S.thermal.full_pct)}% full</b>, currently allowing
        <b>${S.thermal.allowance_w} W</b> of LED. Quiet passages refill it.
        ${S.thermal.standby_w} W of that is standby, which no setting here
        can reduce.</div>` : '<div class="note">No thermal budget loaded.</div>')+
      '<div class="lbl">status</div>'+
      `<div class="note">mode ${S.mode} · ${S.presets.length} presets ·
       ${S.shows.length} shows${S.governor?' · GOVERNOR ACTIVE':''}</div>`;
    const b = document.getElementById('bri');
    b.oninput = ()=>{ if(!busy){ busy=true;
      post('/api/brightness',{value:b.value/100}).finally(()=>busy=false); } };
  }
}

// change one parameter without losing the others
function edit(delta){
  const params = Object.assign({}, S.params || {}, delta);
  return post('/api/preset', {name: S.preset, params});
}

async function loadShow(name){
  await post('/api/show',{name});
  const r = await fetch('/api/state'); S = await r.json();
  // use the show's own track field -- the json and the mp3 do not have
  // to share a name, and guessing one from the other breaks silently
  if(S.track){ au.src = '/audio/' + encodeURIComponent(S.track); }
  au.currentTime = 0;
  draw();
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel'); tab = b.dataset.tab; draw(true);
});
document.getElementById('playbtn').onclick = ()=>{
  if(S && S.mode==='show'){ au.paused ? au.play() : au.pause(); }
};
document.getElementById('back').onclick = ()=>{ au.currentTime = Math.max(0, au.currentTime-15); };
document.getElementById('blackout').onclick = ()=>{ au.pause(); post('/api/off'); };

au.onplay  = ()=>post('/api/clock',{t:au.currentTime, playing:true});
au.onpause = ()=>post('/api/clock',{t:au.currentTime, playing:false});
au.onseeked= ()=>post('/api/clock',{t:au.currentTime, playing:!au.paused});
setInterval(()=>{ if(!au.paused) post('/api/clock',{t:au.currentTime, playing:true}); }, 400);
setInterval(async ()=>{
  try{ const r = await fetch('/api/state'); S = await r.json(); draw(); }
  catch(e){ document.getElementById('dot').className='dot err'; }
}, 1500);

// ---- live preview -------------------------------------------------
// Pulls the frame the controller is actually sending, after the power
// guard, so what you see here is what the helmet is doing rather than
// what the preset asked for.  Without a helmet attached it is the same
// render against the same guard, which is the point: presets can be
// judged from anywhere.
const pc = document.getElementById('prev'), pctx = pc.getContext('2d');
const oc = document.createElement('canvas'), octx = oc.getContext('2d');
const pwrap = document.getElementById('prevwrap');

const PREV_H = [0.30, 0.52, 0.0];        // tap to cycle: normal, big, hidden
const wide = () => window.matchMedia('(min-width:760px)').matches;

function sizePreview(){
  if(!LAY) return;
  let w, h;
  if(wide()){
    // the grid decides the box; fit the helmet's aspect inside it
    const bw = pwrap.clientWidth, bh = pwrap.clientHeight;
    if(bw < 8 || bh < 8) return;
    w = Math.min(bw, bh * LAY.aspect); h = w / LAY.aspect;
  }else{
    w = pwrap.clientWidth || window.innerWidth;
    const frac = PREV_H[prevOn];
    h = frac ? Math.round(Math.min(w / LAY.aspect, window.innerHeight*frac)) : 0;
    pwrap.style.height = h + 'px';
  }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  pc.width = Math.round(Math.max(w,1)*dpr); pc.height = Math.round(Math.max(h,1)*dpr);
  pc.style.width = w+'px'; pc.style.height = h+'px';
}

// LED drive is linear and sight is not, so a shell held at 64/255 by
// the guard is a quarter of the tubes' drive but nothing like a quarter
// as dim to look at.  Drawn linearly the shell vanishes under the ears
// and the preview misrepresents every full-helmet preset.  Encode the
// same way a camera does and the balance matches the photographs.
const GAMMA = new Uint8Array(256);
for(let i=0;i<256;i++) GAMMA[i] = Math.round(255*Math.pow(i/255, 0.45));

// Three passes, because the helmet is three different optical things.
//
//  1  the bodies -- faint outlines and unlit pixels, so a dark helmet
//     still reads as a helmet rather than as an empty box
//  2  bloom -- every lit LED smeared wide and dim.  On the ears this
//     is most of what you actually see: the tubes sit behind a
//     translucent disc and the whole disc glows, which is why a
//     photograph of one lit tube shows a bar and not a dot
//  3  the cores -- small and bright, the pixels themselves
//
// Shell LEDs shrink towards the silhouette by their facing term. An
// LED seen edge-on covers a fraction of the area it does head on, and
// without that the dome renders as a flat plate of even dots.
function paint(buf){
  if(!LAY || pc.height < 4) return;
  const W = pc.width, H = pc.height, S = Math.min(W, H) / 1.4;
  const dpr = W / (pwrap.clientWidth||1);
  pctx.globalCompositeOperation = 'source-over';
  pctx.fillStyle = '#06060a'; pctx.fillRect(0,0,W,H);

  // Filled bodies rather than outlines.  Three large faint rings over
  // a dark background read as stray arcs, not as a head and two ears;
  // a disc the colour of a switched-off diffuser reads as the object.
  for(const p of LAY.parts){
    const R = p.r*W*1.14;
    const g = pctx.createRadialGradient(p.cx*W, p.cy*H, 0, p.cx*W, p.cy*H, R);
    // ending on the page background, not near it: a last stop even one
    // step off draws a visible rim, and three rims read as scribble
    g.addColorStop(0, 'rgba(120,125,145,0.055)');
    g.addColorStop(0.72, 'rgba(120,125,145,0.035)');
    g.addColorStop(1, 'rgba(120,125,145,0)');
    pctx.fillStyle = g;
    pctx.beginPath(); pctx.arc(p.cx*W, p.cy*H, R, 0, 6.2832); pctx.fill();
  }
  pctx.fillStyle = '#16161e';
  for(let i=0;i<LAY.n;i++){
    pctx.beginPath();
    pctx.arc(LAY.x[i]*W, LAY.y[i]*H,
             Math.max(0.5, 1.0*dpr*LAY.size[i]*LAY.face[i]), 0, 6.2832);
    pctx.fill();
  }

  // The diffuse layer, drawn small and scaled up.  A diffuser spreads
  // light, it does not multiply it, so stacking translucent blobs
  // additively is the wrong model -- six tubes of sixteen LEDs each
  // saturate to white long before the disc would.  Rendering into a
  // canvas an eighth the size and letting the upscale interpolate is a
  // blur that conserves energy, and it is one drawImage.
  const ow = Math.max(8, Math.round(W/8)), oh = Math.max(8, Math.round(H/8));
  if(oc.width !== ow || oc.height !== oh){ oc.width = ow; oc.height = oh; }
  octx.clearRect(0,0,ow,oh);
  octx.globalCompositeOperation = 'lighter';
  const sx = ow/W, sy = oh/H;
  for(let i=0;i<LAY.n;i++){
    const r = GAMMA[buf[i*3]], g = GAMMA[buf[i*3+1]], b = GAMMA[buf[i*3+2]];
    if(r+g+b < 9) continue;
    octx.fillStyle = 'rgb('+r+','+g+','+b+')';
    octx.globalAlpha = LAY.bloom[i];
    octx.beginPath();
    octx.arc(LAY.x[i]*W*sx, LAY.y[i]*H*sy,
             Math.max(0.9, dpr*LAY.size[i]*2.4*sx), 0, 6.2832);
    octx.fill();
  }
  octx.globalAlpha = 1.0;
  pctx.globalCompositeOperation = 'lighter';
  pctx.imageSmoothingEnabled = true;
  pctx.imageSmoothingQuality = 'high';
  pctx.drawImage(oc, 0, 0, W, H);
  for(let i=0;i<LAY.n;i++){
    const r = GAMMA[buf[i*3]], g = GAMMA[buf[i*3+1]], b = GAMMA[buf[i*3+2]];
    if(r+g+b < 9) continue;
    const f = LAY.face[i];
    const base = dpr*LAY.size[i]*(0.35 + 0.65*f);
    pctx.fillStyle = 'rgb('+r+','+g+','+b+')';
    pctx.beginPath();
    pctx.arc(LAY.x[i]*W, LAY.y[i]*H, base*1.55, 0, 6.2832); pctx.fill();
  }
  pctx.globalCompositeOperation = 'source-over';
}

// Frames arrive on one open connection.  Polling cost a round trip
// each, which over a tunnel is two hundred milliseconds of nothing and
// a preview stuck at four frames a second however fast the renderer
// is.  Polling stays as the fallback for anything that cannot hold the
// stream open.
let es = null;
function startStream(){
  if(es) es.close();
  const bin = new Uint8Array(LAY.n*3);
  try{
    es = new EventSource('/api/stream');
  }catch(e){ return pollFrames(); }
  es.onmessage = ev=>{
    if(PREV_H[prevOn]===0 && !wide()) return;
    const raw = atob(ev.data);
    for(let i=0;i<bin.length && i<raw.length;i++) bin[i] = raw.charCodeAt(i);
    paint(bin);
  };
  es.onerror = ()=>{ /* EventSource retries on its own */ };
}

async function pollFrames(){
  for(;;){
    if((PREV_H[prevOn]===0 && !wide()) || document.hidden){
      await new Promise(r=>setTimeout(r,400)); continue; }
    const t0 = performance.now();
    try{
      const r = await fetch('/api/frame', {cache:'no-store'});
      paint(new Uint8Array(await r.arrayBuffer()));
    }catch(e){ await new Promise(r=>setTimeout(r,800)); continue; }
    await new Promise(r=>setTimeout(r, Math.max(0, 66 - (performance.now()-t0))));
  }
}

pwrap.onclick = ()=>{ if(wide()) return; prevOn = (prevOn + 1) % PREV_H.length; sizePreview(); };
window.addEventListener('resize', sizePreview);

(async()=>{
  const r = await fetch('/api/state'); S = await r.json(); draw(true);
  try{
    LAY = await (await fetch('/api/layout')).json();
    sizePreview();
    if(window.EventSource) startStream(); else pollFrames();
  }catch(e){ pwrap.style.height = '0px'; }
})();
</script>
