<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d0d10">
<meta name="mobile-web-app-capable" content="yes">
<title>mau5walk</title>
<style>
  :root{--bg:#0d0d10;--card:#17171e;--line:#2a2a35;--fg:#e8e8ef;--dim:#8a8a99;
        --accent:#00c8ff;--hot:#ff2d6f;--ok:#38d39f;--warn:#ffb020}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;overscroll-behavior:none}
  body{background:var(--bg);color:var(--fg);display:flex;flex-direction:column;
       font:16px/1.35 ui-sans-serif,system-ui,-apple-system,Roboto,sans-serif;
       padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{display:flex;align-items:center;gap:9px;padding:9px 14px;
         border-bottom:1px solid var(--line);flex:none}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim)}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.err{background:var(--hot)}
  h1{font-size:14px;margin:0;font-weight:650;letter-spacing:.02em}
  #pwr{margin-left:auto;font-size:12px;color:var(--dim);
       font-variant-numeric:tabular-nums}
  #pwr.cap{color:var(--warn);font-weight:700}

  #head{padding:10px 14px 8px;text-align:center;flex:none}
  #idx{font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  #idx small{font-size:17px;color:var(--dim);font-weight:400}
  #sec{color:var(--accent);font-size:14px;font-weight:650;min-height:19px;
       margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #bar{height:4px;background:#000;border-radius:2px;margin-top:8px;overflow:hidden}
  #fill{height:100%;width:0;background:var(--accent);transition:width .15s}

  main{flex:1;overflow-y:auto;padding:0 12px 10px;-webkit-overflow-scrolling:touch}
  #next{width:100%;height:150px;border-radius:20px;border:none;margin:2px 0 10px;
        background:linear-gradient(180deg,#0097c4,#006c8c);color:#fff;
        font-size:30px;font-weight:800;letter-spacing:.04em;
        box-shadow:0 5px 0 #004c63}
  #next:active{transform:translateY(4px);box-shadow:0 1px 0 #004c63}
  .row{display:flex;gap:9px;margin-bottom:9px}
  .row>*{flex:1}
  button{min-height:54px;border-radius:13px;border:1px solid var(--line);
         background:#20202a;color:var(--fg);font-size:16px;font-weight:650}
  button:active{filter:brightness(1.45)}
  button.k{background:#12252c;border-color:#1d3f4a;color:#a9e6f7}
  button.d{background:#3a1020;border-color:#5a1c33;color:#ffb9cd}
  button.mark{min-height:74px;font-size:17px;font-weight:800;letter-spacing:.02em;
              background:linear-gradient(180deg,#2a6a3f,#1d4c2d);
              border-color:#2f7a49;color:#d8ffe8;box-shadow:0 4px 0 #14351f}
  button.mark:active{transform:translateY(3px);box-shadow:0 1px 0 #14351f}
  .lbl{color:var(--dim);font-size:11px;text-transform:uppercase;
       letter-spacing:.09em;margin:12px 0 5px}
  .seg{display:flex;gap:0;border:1px solid var(--line);border-radius:13px;overflow:hidden}
  .seg button{flex:1;border:none;border-radius:0;min-height:46px;font-size:14px;
              background:#16161d}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.sel{background:var(--accent);color:#04202a;font-weight:800}
  .cols{display:flex;gap:9px}
  .cols button{flex:1;min-height:46px;border-radius:12px;font-size:0}
  .cols button.sel{outline:3px solid var(--fg);outline-offset:-3px}
  input[type=range]{width:100%;height:50px;accent-color:var(--accent);background:none}
  input[type=text],input[type=number]{width:100%;min-height:50px;font-size:16px;
       background:#0b0b0f;color:var(--fg);border:1px solid var(--line);
       border-radius:12px;padding:0 12px;-webkit-user-select:text;user-select:text}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td{padding:9px 7px;border-bottom:1px solid var(--line)}
  td.n{color:var(--dim);font-variant-numeric:tabular-nums;text-align:right;
       white-space:nowrap}
  tr.lit td{background:#12252c}
  .muted{color:var(--dim);font-size:13px;padding:12px 2px;text-align:center}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
         background:#000e;border:1px solid var(--line);padding:10px 16px;
         border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;
         pointer-events:none;max-width:88vw;text-align:center}
  #toast.on{opacity:1}
</style>
</head>
<body>

<header>
  <span class="dot" id="dot"></span><h1>mau5walk</h1><span id="pwr">—</span>
</header>

<section id="head">
  <div id="idx">0<small> / 0</small></div>
  <div id="sec">no section yet</div>
  <div id="bar"><div id="fill"></div></div>
</section>

<main>
  <button id="next">NEXT&nbsp;LED&nbsp;→</button>
  <div class="row">
    <button class="k" id="back">← back</button>
    <button class="k" id="fwd10">+10</button>
    <button class="k" id="back10">−10</button>
  </div>

  <div class="row">
    <button id="newsec" class="mark" style="flex:3">IT JUMPED — NEW SECTION</button>
    <button class="d" id="undosec" style="flex:1">undo</button>
  </div>
  <input type="text" id="nm" placeholder="name for the next section (optional)"
         autocapitalize="off" autocorrect="off" spellcheck="false" list="names">
  <datalist id="names"></datalist>

  <div class="lbl">what lights up</div>
  <div class="seg" id="mode">
    <button data-m="single">one</button>
    <button data-m="trail">trail</button>
    <button data-m="section">section</button>
  </div>

  <div class="lbl">colour</div>
  <div class="cols" id="cols"></div>

  <div class="lbl">brightness <span id="briv" style="color:var(--fg)"></span></div>
  <input type="range" id="bri" min="4" max="255" step="4">

  <div class="lbl">jump to</div>
  <input type="number" id="jump" inputmode="numeric" placeholder="LED number">

  <div class="lbl">sections so far — tap one to light it for a photo</div>
  <table id="tbl"><tbody></tbody></table>
  <div class="row" style="margin-top:10px">
    <button id="save">save session</button>
    <button class="k" id="clearshow">stop photo</button>
  </div>
  <p class="muted" id="caphint"></p>
</main>

<div id="toast"></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const COLORS=[["white",[255,255,255]],["red",[255,0,0]],["green",[0,255,0]],
              ["blue",[0,0,255]],["amber",[255,120,0]]];
let S={}, busy=false, fails=0;

function toast(m,ms=1600){const t=$("#toast");t.textContent=m;t.classList.add("on");
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),ms);}
function buzz(ms=12){ if(navigator.vibrate) try{navigator.vibrate(ms);}catch(e){} }

async function api(path,body){
  try{
    const r=await fetch(path,body?{method:"POST",headers:{"Content-Type":"application/json"},
                                   body:JSON.stringify(body)}:{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    S=await r.json(); fails=0; render(); return S;
  }catch(e){ fails++; $("#dot").className="dot"+(fails>2?" err":""); }
}

function curSection(){ return S.sections && S.sections.length ? S.sections[S.sections.length-1] : null; }

function render(){
  if(!S.count) return;
  $("#dot").className="dot on";
  $("#idx").innerHTML=S.index+"<small> / "+(S.count-1)+"</small>";
  const c=curSection();
  $("#sec").textContent = S.show ? ("photo: LEDs "+S.show[0]+"–"+S.show[1])
          : (c ? c.name+"  (from "+c.start+")" : "no section yet");
  $("#fill").style.width=(100*S.index/Math.max(S.count-1,1))+"%";
  const p=$("#pwr");
  p.textContent=S.lit+" lit · "+S.watts+" W";
  p.className=S.capped?"cap":"";
  $("#caphint").textContent="capped at "+S.max_lit+" LEDs and brightness "
      +S.max_bri+"/255 so it cannot overheat"+(S.capped?" — cap is active now":"");
  [...document.querySelectorAll("#mode button")].forEach(b=>
      b.classList.toggle("sel", b.dataset.m===S.mode));
  [...document.querySelectorAll("#cols button")].forEach((b,i)=>
      b.classList.toggle("sel", COLORS[i][1].join()===(S.color||[]).join()));
  if(document.activeElement!==$("#bri")){ $("#bri").value=S.bri; }
  $("#bri").max=S.max_bri; $("#briv").textContent=S.bri;
  const tb=$("#tbl").querySelector("tbody"); tb.innerHTML="";
  (S.sections||[]).forEach((s,i)=>{
    const last=i===S.sections.length-1;
    const end=last?S.index:s.end;
    const tr=document.createElement("tr");
    if(S.show && S.show[0]===s.start) tr.className="lit";
    tr.innerHTML="<td>"+s.name+"</td><td class='n'>"+s.start+"–"+end+
                 "</td><td class='n'>"+(end-s.start+1)+"</td>";
    tr.onclick=()=>{ buzz(); api("/api/show",{start:s.start,end:end}); toast("lighting "+s.name); };
    tb.appendChild(tr);
  });
  if(!(S.sections||[]).length) tb.innerHTML="<tr><td class='muted' colspan=3>"+
      "walk until the light jumps somewhere new, then start a section</td></tr>";
}

// ---- the main button, with press-and-hold to run ------------------------
let holdT=null, holdI=null;
function stepOnce(d){ buzz(); api("/api/step",{d:d}); }
function holdStart(d){
  stepOnce(d);
  holdT=setTimeout(()=>{ holdI=setInterval(()=>stepOnce(d),110); },550);
}
function holdEnd(){ clearTimeout(holdT); clearInterval(holdI); holdT=holdI=null; }
for(const [el,d] of [[$("#next"),1],[$("#back"),-1]]){
  el.addEventListener("pointerdown",e=>{e.preventDefault();holdStart(d);});
  for(const ev of ["pointerup","pointercancel","pointerleave"]) el.addEventListener(ev,holdEnd);
}
$("#fwd10").onclick=()=>stepOnce(10);
$("#back10").onclick=()=>stepOnce(-10);

$("#newsec").onclick=()=>{
  const n=$("#nm").value.trim();
  buzz(25); api("/api/section",{action:"new",name:n});
  toast("section “"+(n||("section_"+((S.sections||[]).length+1)))+"” starts at "+S.index);
  $("#nm").value="";
};
$("#undosec").onclick=()=>{ buzz(25); api("/api/section",{action:"drop"}); toast("removed last section"); };
$("#clearshow").onclick=()=>api("/api/show",{clear:true});
document.querySelectorAll("#mode button").forEach(b=>
  b.onclick=()=>api("/api/mode",{mode:b.dataset.m}));
$("#bri").oninput=e=>{ $("#briv").textContent=e.target.value;
  clearTimeout($("#bri")._t);
  $("#bri")._t=setTimeout(()=>api("/api/bri",{bri:+e.target.value}),120); };
$("#jump").onchange=e=>{ const v=parseInt(e.target.value,10);
  if(!isNaN(v)){ api("/api/goto",{i:v}); e.target.value=""; e.target.blur(); } };
$("#save").onclick=async()=>{ const r=await fetch("/api/save"); const j=await r.json();
  toast("saved on the mini"); };

const cw=$("#cols");
COLORS.forEach(([n,c])=>{ const b=document.createElement("button");
  b.style.background="rgb("+c.join(",")+")"; b.title=n;
  b.onclick=()=>api("/api/color",{color:c}); cw.appendChild(b); });

// names from the route, so sections get consistent labels
["chin","front_upper","ear1_tubes","ear1_rim","ear2_rim","ear2_tubes"].forEach(n=>{
  const o=document.createElement("option"); o.value=n; $("#names").appendChild(o); });

api("/api/state");
setInterval(()=>{ if(!holdI) api("/api/state"); },1200);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) api("/api/state"); });
</script>
</body>
</html>
