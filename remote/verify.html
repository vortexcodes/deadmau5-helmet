<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d0d10">
<meta name="mobile-web-app-capable" content="yes">
<title>mau5verify</title>
<style>
  :root{--bg:#0d0d10;--card:#17171e;--line:#2a2a35;--fg:#e8e8ef;--dim:#8a8a99;
        --accent:#00c8ff;--hot:#ff2d6f;--ok:#38d39f;--warn:#ffb020}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;overscroll-behavior:none}
  body{background:var(--bg);color:var(--fg);display:flex;flex-direction:column;
       font:16px/1.35 ui-sans-serif,system-ui,-apple-system,Roboto,sans-serif;
       padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{display:flex;align-items:center;gap:9px;padding:9px 14px;
         border-bottom:1px solid var(--line);flex:none}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim)}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.err{background:var(--hot)}
  h1{font-size:14px;margin:0;font-weight:650;letter-spacing:.02em}
  #pwr{margin-left:auto;font-size:12px;color:var(--dim);
       font-variant-numeric:tabular-nums}
  #pwr.cap{color:var(--warn);font-weight:700}

  main{flex:1;overflow-y:auto;padding:12px 12px 24px;-webkit-overflow-scrolling:touch}
  .card{background:var(--card);border:1px solid var(--line);border-radius:15px;
        padding:13px 14px;margin-bottom:11px}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .n{font-size:11px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase}
  .t{font-size:18px;font-weight:700;margin:3px 0 7px}
  .look{font-size:14px;color:#c6c6d4;margin-bottom:8px}
  .settles{font-size:12px;color:var(--dim);font-style:italic;margin-bottom:10px}
  .spans{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
  .sp{display:flex;align-items:center;gap:6px;background:#0e0e14;
      border:1px solid var(--line);border-radius:9px;padding:4px 9px;font-size:12px;
      font-variant-numeric:tabular-nums}
  .sw{width:13px;height:13px;border-radius:4px;border:1px solid #0006}
  .sp b{font-weight:650;color:var(--dim)}
  button.light{width:100%;min-height:62px;border-radius:14px;border:none;
       background:linear-gradient(180deg,#0097c4,#006c8c);color:#fff;
       font-size:19px;font-weight:800;letter-spacing:.03em;box-shadow:0 4px 0 #004c63}
  button.light:active{transform:translateY(3px);box-shadow:0 1px 0 #004c63}
  .card.sel button.light{background:linear-gradient(180deg,#2a6a3f,#1d4c2d);
       box-shadow:0 4px 0 #14351f}
  #offbar{position:sticky;bottom:0;padding:10px 12px;background:
          linear-gradient(180deg,#0d0d1000,#0d0d10 38%);flex:none}
  #off{width:100%;min-height:56px;border-radius:14px;font-size:17px;font-weight:700;
       background:#3a1020;border:1px solid #5a1c33;color:#ffb9cd}
</style>
</head>
<body>
<header><span class="dot" id="dot"></span><h1>mau5verify</h1>
  <span id="pwr">--</span></header>
<main id="list"></main>
<div id="offbar"><button id="off">ALL OFF</button></div>
<script>
let S = null, sel = null;

function hex(c){return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')}

function render(){
  const L = document.getElementById('list');
  L.innerHTML = '';
  S.checks.forEach((c,i)=>{
    const d = document.createElement('div');
    d.className = 'card' + (i===sel ? ' sel' : '');
    const spans = c.spans.map(s=>
      `<span class="sp"><span class="sw" style="background:${hex(s.color)}"></span>`+
      `${s.lo}&ndash;${s.hi} <b>${s.label}</b></span>`).join('');
    d.innerHTML =
      `<div class="n">check ${i+1} of ${S.checks.length}</div>`+
      `<div class="t">${c.title}</div>`+
      `<div class="look">${c.look}</div>`+
      `<div class="settles">${c.settles}</div>`+
      `<div class="spans">${spans}</div>`+
      `<button class="light">${i===sel ? 'LIT — TAKE THE PHOTO' : 'LIGHT THIS'}</button>`;
    d.querySelector('button').onclick = ()=>pick(i);
    L.appendChild(d);
  });
}

function status(){
  const p = document.getElementById('pwr');
  p.textContent = S.lit + ' lit · ' + S.watts + ' W';
  p.className = S.capped ? 'cap' : '';
  document.getElementById('dot').className = 'dot on';
}

async function post(path, body){
  try{
    const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'},
                                body: JSON.stringify(body||{})});
    S = await r.json(); status(); render();
  }catch(e){ document.getElementById('dot').className = 'dot err'; }
}

function pick(i){ sel = (sel===i ? null : i); post('/api/select', {i: sel}); }
document.getElementById('off').onclick = ()=>{ sel = null; post('/api/select', {i:null}); };

(async ()=>{
  const r = await fetch('/api/state'); S = await r.json();
  sel = S.selected; status(); render();
  setInterval(async ()=>{
    try{ const r = await fetch('/api/state'); S = await r.json(); status(); }
    catch(e){ document.getElementById('dot').className='dot err'; }
  }, 3000);
})();
</script>
</body>
</html>
